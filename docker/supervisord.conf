; Ratio Guardian — supervisord: web e worker nello stesso container.
;
; Il programma "worker" (APScheduler in-process, vedi CLAUDE.md roadmap
; step 9) va aggiunto qui una volta che app/worker.py esiste. Per ora
; supervisord gestisce solo il processo web.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=uvicorn app.main:app --host 0.0.0.0 --port 8080
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
