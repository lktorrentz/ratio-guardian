; Ratio Guardian — supervisord gestisce il processo web.
;
; Lo scheduler (APScheduler) gira in-process dentro l'app FastAPI stessa
; (vedi app/scheduler.py), non come programma supervisord separato.
;
; supervisord resta root (necessario come PID 1 e per aprire /dev/stdout
; e /dev/stderr dei figli senza EACCES). Il drop dei privilegi a PUID:PGID
; (docker/entrypoint.sh) avviene qui, per programma, non a livello di
; supervisord stesso.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=uvicorn app.main:app --host 0.0.0.0 --port 8080
directory=/app
user=%(ENV_RUN_AS_USER)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
